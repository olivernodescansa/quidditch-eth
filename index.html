<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora de Oliver Wood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Homemade+Apple&display=swap" rel="stylesheet">
<style>
  :root{
    --bordo-centro: #3a0c14;
    --bordo-medio: #22060c;
    --negro-borde: #060102;
    --negro-calido: #0b0203;
    --pergamino: #e8dcc0;
    --oro-viejo: #b9954f;
    --tinta: #7a1018;
    --tinta-oscura: #4a0910;
    --grieta-plata: #d9dae2;
    --grieta-sombra: #1c0508;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background: var(--negro-borde);
    overflow:hidden;
  }

  body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background:
      radial-gradient(ellipse at center, var(--bordo-centro) 0%, var(--bordo-medio) 45%, var(--negro-borde) 85%, var(--negro-calido) 100%);
  }

  /* viñeta y textura sutil */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse at center, transparent 40%, rgba(9,1,3,0.55) 100%);
    z-index:2;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.05;
    background-image: repeating-radial-gradient(circle at 20% 30%, #fff 0, transparent 1px, transparent 3px);
    z-index:1;
  }

  .stage{
    position:relative;
    z-index:3;
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap: clamp(1.4rem, 4vh, 2.6rem);
    padding: 5vh 5vw;
  }

  .title-block{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: clamp(0.8rem, 3vh, 1.8rem);
    width:100%;
  }

  /* ---------- TEXTO 1: Estrategias de Quidditch ---------- */
  .strike-wrap{
    position:relative;
    display:inline-block;
    opacity:0;
    animation: aparecer1 0.9s ease-out forwards;
  }

  @keyframes aparecer1{
    0%{ opacity:0; transform: translateY(8px); }
    100%{ opacity:1; transform: translateY(0); }
  }

  .text1{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-weight:500;
    letter-spacing: 0.04em;
    font-size: clamp(0.85rem, 4.6vw, 2.6rem);
    color: var(--pergamino);
    text-shadow: 0 0 18px rgba(185,149,79,0.25);
    white-space: nowrap;
    max-width: 92vw;
    display: inline-block;
  }

  .scribble-svg{
    position:absolute;
    top:50%;
    left:50%;
    transform: translate(-50%,-55%);
    width:112%;
    height:220%;
    overflow:visible;
    pointer-events:none;
  }

  .scribble-path{
    fill:none;
    stroke: var(--tinta);
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: url(#tinta-aspera);
  }

  .scribble-1{
    stroke-width:5.5;
    stroke-dasharray: 620;
    stroke-dashoffset: 620;
    opacity:0.95;
    animation: trazo1 0.28s cubic-bezier(.55,0,.85,.35) 0.95s forwards;
  }

  .scribble-2{
    stroke-width:3.5;
    stroke: var(--tinta-oscura);
    stroke-dasharray: 560;
    stroke-dashoffset: 560;
    opacity:0.85;
    animation: trazo2 0.22s cubic-bezier(.6,0,.9,.3) 1.12s forwards;
  }

  @keyframes trazo1{
    to{ stroke-dashoffset:0; }
  }
  @keyframes trazo2{
    to{ stroke-dashoffset:0; }
  }

  .strike-wrap.impacto{
    animation: aparecer1 0.9s ease-out forwards, golpe 0.35s ease-out 0.95s;
  }

  @keyframes golpe{
    0%{ transform: translate(0,0) rotate(0deg); }
    20%{ transform: translate(-3px,1px) rotate(-0.6deg); }
    40%{ transform: translate(3px,-1px) rotate(0.7deg); }
    60%{ transform: translate(-2px,0) rotate(-0.4deg); }
    80%{ transform: translate(1px,1px) rotate(0.3deg); }
    100%{ transform: translate(0,0) rotate(0deg); }
  }

  .strike-wrap.desvanecido .text1{
    animation: desvanecer 0.7s ease-in 1.5s forwards;
  }
  .strike-wrap.desvanecido .scribble-svg{
    animation: desvanecer 0.7s ease-in 1.5s forwards;
  }

  @keyframes desvanecer{
    to{ opacity:0.28; filter: blur(0.3px); }
  }

  /* ---------- TEXTO 2: Bitácora de Oliver Wood ---------- */
  .text2{
    font-family:'Homemade Apple', cursive;
    font-weight:400;
    color: var(--oro-viejo);
    font-size: clamp(1.4rem, 8vw, 4.4rem);
    line-height:1.3;
    text-shadow: 0 0 22px rgba(185,149,79,0.3);
    margin:0;
    max-width: 88vw;
    word-break: keep-all;
    overflow-wrap: normal;
    -webkit-hyphens: none;
    hyphens: none;
  }

  .word{
    display: inline-block;
    white-space: nowrap;
    word-break: keep-all;
    overflow-wrap: normal;
  }

  .letter{
    display:inline-block;
    opacity:0;
    white-space:pre;
    transform: translateY(var(--ty)) rotate(var(--rot));
    animation:
      revelar 0.45s ease-out var(--delay) forwards,
      tiemble var(--tdur) ease-in-out var(--tdelay) infinite;
  }

  @keyframes revelar{
    0%{ opacity:0; transform: translateY(calc(var(--ty) - 12px)) rotate(calc(var(--rot) - 5deg)); }
    100%{ opacity:1; transform: translateY(var(--ty)) rotate(var(--rot)); }
  }

  @keyframes tiemble{
    0%, 100%{ transform: translateY(var(--ty)) rotate(var(--rot)); }
    25%{ transform: translateY(calc(var(--ty) - 1px)) rotate(calc(var(--rot) - 0.5deg)); }
    50%{ transform: translateY(calc(var(--ty) + 1.4px)) rotate(calc(var(--rot) + 0.6deg)); }
    75%{ transform: translateY(calc(var(--ty) + 0.6px)) rotate(calc(var(--rot) - 0.4deg)); }
  }

  /* ---------- BOTON ---------- */
  .intro-btns{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap: clamp(0.8rem, 2vw, 1.4rem);
  }

  .read-btn{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1rem, 2.2vw, 1.3rem);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--pergamino);
    background: transparent;
    border: 1px solid var(--oro-viejo);
    padding: 0.75em 2.1em;
    border-radius: 2px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:0.6em;
    opacity:0;
    transform: translateY(10px);
    pointer-events:none;
    transition: border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
  }

  .read-btn.visible{
    animation: entrarBoton 0.8s ease-out forwards;
    pointer-events:auto;
  }

  @keyframes entrarBoton{
    to{ opacity:1; transform: translateY(0); }
  }

  .read-btn:hover{
    background: rgba(185,149,79,0.08);
    border-color: var(--pergamino);
    box-shadow: 0 0 20px rgba(185,149,79,0.25);
  }

  .read-btn .flecha{
    display:inline-block;
    transition: transform 0.3s ease;
    font-style: normal;
  }

  .read-btn:hover .flecha{
    transform: translateX(5px);
  }

  @media (max-width: 420px){
    .stage{
      gap: clamp(1rem, 3.5vh, 1.8rem);
      padding: 4vh 6vw;
    }
    .title-block{
      gap: clamp(0.6rem, 2.2vh, 1.2rem);
    }
    .read-btn{
      padding: 0.65em 1.7em;
      letter-spacing: 0.08em;
    }
  }

  @media (max-width: 360px){
    .text1{
      font-size: clamp(0.72rem, 4vw, 1.3rem);
    }
    .text2{
      font-size: clamp(1.15rem, 8vw, 2rem);
    }
  }

  /* =========================================================
     PANTALLA 1: portada — transición de salida
  ========================================================= */
  #screenIntro{
    transition: opacity 0.5s ease;
  }
  #screenIntro.fundido{
    opacity:0;
    pointer-events:none;
  }

  /* =========================================================
     PANTALLA 2: lector de la bitácora
  ========================================================= */
  #screenReader{
    position:fixed;
    inset:0;
    z-index:3;
    display:none;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition: opacity 0.6s ease;
    padding: 4vh 4vw;
    --nivel: 0;
    background:
      radial-gradient(ellipse at center,
        color-mix(in srgb, var(--bordo-centro) calc(100% - var(--nivel) * 8%), var(--negro-calido) calc(var(--nivel) * 8%)) 0%,
        color-mix(in srgb, var(--bordo-medio) calc(100% - var(--nivel) * 8%), var(--negro-calido) calc(var(--nivel) * 8%)) 45%,
        var(--negro-borde) 85%, var(--negro-calido) 100%);
    transition: opacity 0.6s ease, background 1s ease;
  }
  #screenReader.abierto{ display:flex; }
  #screenReader.visible{ opacity:1; }

  .page-counter{
    position:fixed;
    top: max(1.2rem, env(safe-area-inset-top));
    right: 1.4rem;
    z-index:6;
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    color: rgba(232,220,192,0.4);
    pointer-events:none;
  }

  .journal-page{
    position:relative;
    z-index:3;
    width:min(92vw, 680px);
    max-height:80vh;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap: clamp(1.1rem, 3vh, 1.6rem);
    text-align:left;
    padding: clamp(1.7rem, 4.5vw, 3rem) clamp(1.5rem, 4.5vw, 2.8rem);
    background: linear-gradient(180deg, rgba(24,5,8,0.4), rgba(6,1,2,0.6));
    border: 1px solid rgba(185,149,79,0.16);
    border-radius: 2px;
    box-shadow: 0 0 46px rgba(0,0,0,0.5) inset, 0 20px 60px rgba(0,0,0,0.55);
    opacity:1;
    transform: translateY(0);
    transition: opacity 0.4s ease, transform 0.4s ease, filter 0.9s ease;
  }
  .journal-page.transicion{
    opacity:0;
    transform: translateY(-10px);
  }
  .journal-page::-webkit-scrollbar{ width:6px; }
  .journal-page::-webkit-scrollbar-thumb{ background: rgba(185,149,79,0.25); border-radius:3px; }

  .entry-date{
    margin:0;
    font-family:'Homemade Apple', cursive;
    font-size: clamp(1.5rem, 4.4vw, 2.2rem);
    color: var(--oro-viejo);
    text-shadow: 0 0 14px rgba(185,149,79,0.22);
  }

  .entry-body{
    display:flex;
    flex-direction:column;
    gap: 1em;
    transition: opacity 0.9s ease, filter 0.9s ease;
  }

  .entry-body p{
    margin:0;
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size: clamp(1rem, 2.1vw, 1.18rem);
    line-height:1.75;
    color: var(--pergamino);
  }

  .tachon{
    display:inline-block;
    vertical-align: -0.1em;
    margin: 0 0.18em;
    line-height: 0;
  }
  .tachon-svg{ display:block; }
  .tachon-trazo{
    fill:none;
    stroke: var(--pergamino);
    stroke-width: 2.6;
    stroke-linecap: round;
    opacity: 0.85;
  }

  .journal-page.hoja-arrancada .entry-body{
    align-items:center;
    text-align:center;
  }
  .journal-page.hoja-arrancada .entry-body p{
    font-style: italic;
    color: rgba(232,220,192,0.55);
    letter-spacing: 0.03em;
  }
  .journal-page.hoja-arrancada .entry-date{
    text-align:center;
    color: rgba(185,149,79,0.45);
  }

  .nav-btn{
    align-self:center;
    margin-top: 0.4rem;
  }

  /* =========================================================
     GRIETAS DE ESPEJO ROTO
  ========================================================= */
  #darkOverlay{
    position:fixed;
    inset:0;
    z-index:4;
    pointer-events:none;
    opacity:0;
    background: radial-gradient(circle at 50% 50%, transparent 15%, rgba(9,1,3,0.88) 100%);
    transition: opacity 1.1s ease;
  }

  #crackOverlay{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:5;
    pointer-events:none;
  }

  .crack-seg{
    stroke: var(--grieta-plata);
    stroke-linecap: round;
    opacity:0;
    filter:
      drop-shadow(0 0 3px rgba(217,218,226,0.55))
      drop-shadow(0 0 1px var(--grieta-sombra));
    transition: opacity 0.9s ease;
  }

  .crack-shard{
    fill: var(--negro-calido);
    stroke: rgba(217,218,226,0.28);
    stroke-width: 1;
    opacity:0;
    transition: opacity 1.3s ease;
  }

  /* =========================================================
     MODO BRUMA — pagina final, sin grietas, fondo oscuro
     con niebla plateada en movimiento
  ========================================================= */
  body.bruma-modo{
    background: radial-gradient(ellipse at center, #111219 0%, #08080b 50%, #020203 100%);
  }

  #screenReader.bruma-activa{
    background: radial-gradient(ellipse at center, #14151c 0%, #0a0a0e 45%, #050506 85%, #020203 100%);
  }

  #brumaCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
    opacity:0;
    filter: blur(18px);
    transition: opacity 1.8s ease;
  }
  #brumaCanvas.activo{ opacity:1; }

  #brumaBlackSVG{
    position:fixed;
    top:50%;
    left:50%;
    width:min(92.8vw,92.8vh);
    height:min(92.8vw,92.8vh);
    margin-top:calc(min(92.8vw,92.8vh) / -2);
    margin-left:calc(min(92.8vw,92.8vh) / -2);
    z-index:2;
    pointer-events:none;
    opacity:0;
    overflow:visible;
    transition: opacity 1.8s ease;
  }
  #brumaBlackSVG.activo{ opacity:1; }

  #journalBlackGroup{
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }

  .journal-page.bruma-articulo{
    background: linear-gradient(180deg, rgba(19,20,27,0.55), rgba(4,4,6,0.78));
    border-color: rgba(199,203,214,0.16);
    box-shadow: 0 0 50px rgba(0,0,0,0.6) inset, 0 20px 70px rgba(0,0,0,0.6);
  }

  .journal-page.bruma-articulo .entry-date{
    color: var(--grieta-plata);
    text-shadow: 0 0 16px rgba(199,203,214,0.3);
  }

  .journal-page.bruma-articulo .entry-body p{
    color: #d7d9e2;
  }

  .journal-page.bruma-articulo .tachon-trazo{
    stroke: #d7d9e2;
  }

  /* =========================================================
     EFECTO AGUA — pagina 4 de agosto: gotas de lluvia sobre
     la pantalla + petalos de jazmin flotando, con reacciones
     al llegar el scroll a ciertos puntos del texto
  ========================================================= */
  .water-drops, .petalos-jazmin{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    opacity:0;
    overflow:hidden;
    transition: opacity 1.6s ease;
  }
  .water-drops.activo, .petalos-jazmin.activo{ opacity:1; }
  .petalos-jazmin.petalos-ocultos{ opacity:0; transition: opacity 4.2s ease; }

  #waterDrops{
    --gota-color: 214,224,236;
    --gota-lentitud: 1;
    --gota-espesor: 1;
  }

  .gota-corredera{
    position:absolute;
    top:-14vh;
    width: calc(2px * var(--gota-espesor, 1));
    border-radius:2px;
    background: linear-gradient(180deg,
      rgba(var(--gota-color, 214,224,236),0) 0%,
      rgba(var(--gota-color, 214,224,236),.5) 35%,
      rgba(var(--gota-color, 214,224,236),.85) 65%,
      rgba(var(--gota-color, 214,224,236),0) 100%);
    filter: blur(.3px);
    animation-name: gota-caida;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-duration: calc(var(--gota-dur-base, 3.5s) * var(--gota-lentitud, 1));
    transition: width 1.4s ease;
  }
  @keyframes gota-caida{
    0%{ transform: translateY(0); opacity:0; }
    10%{ opacity: var(--gota-op, .55); }
    82%{ opacity: var(--gota-op, .55); }
    100%{ transform: translateY(124vh); opacity:0; }
  }
  .gota-fija{
    position:absolute;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%,
      rgba(255,255,255,.6), rgba(var(--gota-color, 202,216,232),.22) 45%, rgba(var(--gota-color, 202,216,232),0) 76%);
    animation-name: gota-brillo;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-duration: calc(3.8s * var(--gota-lentitud, 1));
  }
  @keyframes gota-brillo{
    0%,100%{ opacity:.3; }
    50%{ opacity:.65; }
  }

  .petalo{
    position:absolute;
    top:-9vh;
    width:11px;
    height:17px;
    background: linear-gradient(160deg, #f5eed9, #e6dab6 55%, #cdbc8c);
    border-radius: 62% 38% 66% 34% / 55% 62% 38% 45%;
    opacity:0;
    box-shadow: 0 0 5px rgba(0,0,0,.28);
    animation-name: petalo-caida;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes petalo-caida{
    0%{ transform: translate(0,0) rotate(0deg); opacity:0; }
    10%{ opacity:.85; }
    50%{ transform: translate(var(--deriva, 24px), 55vh) rotate(160deg); }
    88%{ opacity:.65; }
    100%{ transform: translate(calc(var(--deriva, 24px) * 2), 118vh) rotate(300deg); opacity:0; }
  }

  .journal-page.pagina-mojada{
    box-shadow:
      0 0 60px rgba(120,150,180,0.14) inset,
      0 20px 70px rgba(0,0,0,0.6);
  }

  /* vibracion sutil, en pulsos, no continua */
  @keyframes vibracion-pulso{
    0%, 55%, 100%{ transform: translate(0,0); }
    58%{ transform: translate(-1.4px,1px); }
    61%{ transform: translate(1.4px,-1px); }
    64%{ transform: translate(-1px,-1.2px); }
    67%{ transform: translate(1px,1px); }
    70%{ transform: translate(-0.6px,0.6px); }
    73%{ transform: translate(0,0); }
    5%{ transform: translate(0,0); }
    8%{ transform: translate(-1px,0.8px); }
    11%{ transform: translate(1px,-0.8px); }
    14%{ transform: translate(0,0); }
  }
  #screenReader.vibracion-activa{
    animation: vibracion-pulso 2.8s ease-in-out infinite;
  }

</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="tinta-aspera" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
  </filter>
</svg>

<div class="stage" id="screenIntro">
  <div class="title-block">
    <div class="strike-wrap" id="strikeWrap">
      <span class="text1">Estrategias de Quidditch</span>
      <svg class="scribble-svg" viewBox="0 0 400 90" preserveAspectRatio="none">
        <path class="scribble-path scribble-1" d="M8,48 C60,18 120,62 180,30 C240,4 300,58 392,40" />
        <path class="scribble-path scribble-2" d="M14,58 C90,66 160,20 230,50 C290,72 340,26 386,52" />
      </svg>
    </div>

    <h1 class="text2" id="text2"></h1>
  </div>

  <div class="intro-btns">
    <button class="read-btn" id="readBtn">
      <span>Leer</span><span class="flecha">&#8594;</span>
    </button>
    <button class="read-btn" id="lastPageBtn">
      <span>Ir a la última página</span><span class="flecha">&#8594;</span>
    </button>
  </div>
</div>

<div id="screenReader">
  <div id="darkOverlay"></div>
  <svg id="crackOverlay" preserveAspectRatio="none"></svg>
  <canvas id="brumaCanvas"></canvas>
  <svg id="brumaBlackSVG" viewBox="0 0 640 640" preserveAspectRatio="xMidYMid meet">
    <defs>
      <filter id="turbBlackJournal" x="-60%" y="-60%" width="220%" height="220%">
        <feTurbulence type="turbulence" baseFrequency="0.02 0.03" numOctaves="2" seed="19" result="noiseJournal">
          <animate attributeName="baseFrequency" dur="0.9s" values="0.02 0.03;0.05 0.01;0.015 0.04;0.02 0.03" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noiseJournal" scale="46"/>
      </filter>
    </defs>
    <g id="journalBlackGroup">
      <circle id="journalBlackMass" cx="320" cy="320" r="92" fill="#030105" filter="url(#turbBlackJournal)">
        <animate attributeName="r" values="92;104;88;98;92" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="320" cy="320" r="92" fill="none" stroke="#4a0910" stroke-width="0.6" opacity="0.35" filter="url(#turbBlackJournal)"/>
    </g>
  </svg>

  <div class="water-drops" id="waterDrops"></div>
  <div class="petalos-jazmin" id="jazminPetalos"></div>

  const inicioEscritura = 1550; // cuando empieza a "escribirse" el texto 2
  const pasoEntreLetras = 65;

  let letras = [];
  let i = 0;

  palabras.forEach((palabra, pIdx) => {
    // cada palabra se envuelve en un span "sellado" (nowrap) para que el
    // navegador solo pueda saltar de línea ENTRE palabras, nunca dentro de una
    const wordWrap = document.createElement('span');
    wordWrap.classList.add('word');

    [...palabra].forEach((ch) => {
      const span = document.createElement('span');
      span.textContent = ch;
      span.classList.add('letter');

      const rot = (Math.random() * 7 - 3.5).toFixed(2) + 'deg';
      const ty = (Math.random() * 11 - 5.5).toFixed(1) + 'px';
      const delay = (inicioEscritura + i * pasoEntreLetras) + 'ms';
      const tdur = (2.4 + Math.random() * 1.6).toFixed(2) + 's';
      const tdelay = (inicioEscritura + i * pasoEntreLetras + 450) + 'ms';

      span.style.setProperty('--rot', rot);
      span.style.setProperty('--ty', ty);
      span.style.setProperty('--delay', delay);
      span.style.setProperty('--tdur', tdur);
      span.style.setProperty('--tdelay', tdelay);

      wordWrap.appendChild(span);
      letras.push(span);
      i++;
    });

    contenedor.appendChild(wordWrap);

    // espacio real entre palabras (aquí sí puede saltar la línea)
    if (pIdx < palabras.length - 1) {
      contenedor.appendChild(document.createTextNode(' '));

        "No sé nombrarla mejor. Es negra, no del negro de una sombra sino del negro de algo que ocupa lugar, que tiene peso, y estaba justo ahí, en el medio del camino que uso siempre para llegar a esa zona de la mente. La empujé —o intenté, con la misma técnica de siempre, la misma presión mental que uso para correr un espejo incómodo hacia un costado— y me empujó de vuelta. No es que no cediera. Es que respondió. Como si tuviera intención.",
        "No terminé de buscar. No pude.",
        "Continuamos el camino así, solo respirando, esperando que la masa se corriera sola o que yo encontrara el coraje de volver a empujar, y no pasó ninguna de las dos cosas.",
        "Ya en el valle escuché una pregunta. ¿Qué heredaría un mago? Y antes de que pudiera pensar nada, antes de decidir si esa pregunta era para mí o simplemente el aire del lugar jugando con el sonido, una respuesta apareció en mi cabeza. No la busqué. No la armé yo. Estaba ahí de golpe, entera, como si alguien la hubiera dejado servida.",
        "Núcleos de Sangre.",
        "No sé de dónde salió eso. No sé por qué mi cabeza lo trajo así, tan rápido, tan sin esfuerzo, cuando para cualquier otra cosa tengo que bajar y buscar entre espejos con la masa negra empujándome de vuelta. Esto no lo busqué. Esto vino solo. Y eso me asusta más que la pregunta del valle.",
        "Vos sos la llave.",
        "¿Qué llave?",
        "Lo escribo así, tal cual me quedó dando vueltas toda la noche, porque no tengo mejor forma de decirlo. No entiendo nada. No sé de qué puerta habla, no sé qué es lo que se supone que abro, no sé si soy la llave de algo bueno o de algo que ojalá se hubiera quedado cerrado.",
        "Lo único que tengo es esto: una pregunta que no elegí escuchar, una respuesta que no elegí pensar, y una frase que no elegí que me dijeran. Nada de esta noche lo elegí yo. Y sin embargo todo pasó adentro mío, o cerca, o a través mío, no sé bien cómo decirlo todavía. Es que por primera vez en años intenté entrar a mi propia cabeza y algo de adentro no me dejó pasar.",
        "Voy a intentar dormir. No creo que sirva de mucho."
      ]
    }
  ];

  let indiceActual = 0;

  const screenIntro  = document.getElementById('screenIntro');
  const screenReader = document.getElementById('screenReader');
  const journalPage  = document.getElementById('journalPage');
  const entryDateEl  = document.getElementById('entryDate');
  const entryBodyEl  = document.getElementById('entryBody');
  const navBtn       = document.getElementById('navBtn');
  const pageCounter  = document.getElementById('pageCounter');
  const darkOverlay  = document.getElementById('darkOverlay');

  /* ---- generador de grietas (determinístico) ---- */
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function construirGrietas(){
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('crackOverlay');
    svg.innerHTML = '';
    const W = window.innerWidth, H = window.innerHeight;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    const rand = mulberry32(20260729);
    const cx = W / 2, cy = H / 2;
    const esquinas = [ {x:0,y:0}, {x:W,y:0}, {x:W,y:H}, {x:0,y:H} ];

    esquinas.forEach(esquina => {
      const ramasPorEsquina = 6;
      for(let b=0; b<ramasPorEsquina; b++){
        let x = esquina.x + (rand()-0.5) * W * 0.06;
        let y = esquina.y + (rand()-0.5) * H * 0.06;
        const anguloBase = Math.atan2(cy - esquina.y, cx - esquina.x);
        let angulo = anguloBase + (rand()-0.5) * 0.9;

        const numSegs = 6 + Math.floor(rand()*4);
        const largoTotal = Math.min(W,H) * (0.4 + rand()*0.2);
        const largoSeg = largoTotal / numSegs;

        for(let s=0; s<numSegs; s++){
          angulo += (rand()-0.5) * 0.5;
          const nx = x + Math.cos(angulo) * largoSeg * (0.7 + rand()*0.6);
          const ny = y + Math.sin(angulo) * largoSeg * (0.7 + rand()*0.6);

          const t = s / (numSegs - 1);
          const umbral = Math.max(1, Math.round(t * NIVEL_MAX));
          const grosor = 3.1 - t * 2.2;

          const linea = document.createElementNS(svgNS, 'line');
          linea.setAttribute('x1', x.toFixed(1));
          linea.setAttribute('y1', y.toFixed(1));
          linea.setAttribute('x2', nx.toFixed(1));
          linea.setAttribute('y2', ny.toFixed(1));
          linea.setAttribute('stroke-width', grosor.toFixed(2));
          linea.classList.add('crack-seg');
          linea.dataset.umbral = umbral;
          svg.appendChild(linea);

          if(s >= 2 && rand() < 0.28){
            const anguloBif = angulo + (rand()-0.5) * 1.4;
            const largoBif = largoSeg * (0.5 + rand()*0.6);
            const fx = nx + Math.cos(anguloBif) * largoBif;
            const fy = ny + Math.sin(anguloBif) * largoBif;
            const bif = document.createElementNS(svgNS, 'line');
            bif.setAttribute('x1', nx.toFixed(1));
            bif.setAttribute('y1', ny.toFixed(1));
            bif.setAttribute('x2', fx.toFixed(1));
            bif.setAttribute('y2', fy.toFixed(1));
            bif.setAttribute('stroke-width', (grosor*0.6).toFixed(2));
            bif.classList.add('crack-seg');
            bif.dataset.umbral = Math.min(NIVEL_MAX, umbral + 1);
            svg.appendChild(bif);
          }
          x = nx; y = ny;
        }
      }
    });

    // esquirlas oscuras: se suman recién en niveles altos, tapando cada vez más pantalla
    const esquirlas = [5,6,7,8,9,10];
    esquinas.forEach((esquina, idx) => {
      esquirlas.forEach(nivel => {
        const alcance = Math.min(W,H) * (0.14 + (nivel/NIVEL_MAX) * 0.55);
        const dirx = esquina.x === 0 ? 1 : -1;
        const diry = esquina.y === 0 ? 1 : -1;
        const p1 = esquina;
        const p2 = { x: esquina.x + dirx*alcance*(0.6+rand()*0.4), y: esquina.y };
        const p3 = { x: esquina.x, y: esquina.y + diry*alcance*(0.6+rand()*0.4) };
        const p4 = { x: esquina.x + dirx*alcance*(0.32+rand()*0.35), y: esquina.y + diry*alcance*(0.32+rand()*0.35) };
        const poly = document.createElementNS(svgNS, 'polygon');
        poly.setAttribute('points', `${p1.x},${p1.y} ${p2.x},${p2.y} ${p4.x},${p4.y} ${p3.x},${p3.y}`);
        poly.classList.add('crack-shard');
        poly.dataset.umbral = nivel;
        poly.style.setProperty('--op', (0.18 + (nivel/NIVEL_MAX)*0.55).toFixed(2));
        svg.appendChild(poly);
      });
    });
  }

  function aplicarNivel(nivel){
    document.querySelectorAll('.crack-seg').forEach(el => {
      const umbral = parseInt(el.dataset.umbral, 10);
      if(umbral <= nivel){
        const intensidad = Math.min(0.95, 0.45 + (nivel - umbral) * 0.06 + umbral * 0.03);
        el.style.opacity = intensidad.toFixed(2);
      } else {
        el.style.opacity = 0;
      }
    });
    document.querySelectorAll('.crack-shard').forEach(el => {
      const umbral = parseInt(el.dataset.umbral, 10);
      if(umbral <= nivel){
        const base = parseFloat(el.style.getPropertyValue('--op')) || 0.4;
        const crecimiento = Math.min(1, 0.55 + (nivel / NIVEL_MAX) * 0.6);
        el.style.opacity = Math.min(0.92, base * crecimiento).toFixed(2);
      } else {
        el.style.opacity = 0;
      }
    });
    darkOverlay.style.opacity = (nivel / NIVEL_MAX * 0.7).toFixed(2);
    screenReader.style.setProperty('--nivel', nivel);
    journalPage.style.filter =
      `brightness(${(1 - nivel*0.045).toFixed(3)}) contrast(${(1 + nivel*0.02).toFixed(3)}) saturate(${(1 - nivel*0.05).toFixed(3)})`;
    const desenfoque = Math.max(0, (nivel - 6) * 0.2).toFixed(2);
    entryBodyEl.style.filter = `blur(${desenfoque}px)`;
    entryBodyEl.style.opacity = nivel >= 9 ? '0.55' : (nivel >= 7 ? '0.78' : '1');
  }

  /* ---- tachones: reemplazan texto entre corchetes por un garabato ilegible ---- */
  function crearTachon(unidades){
    const svgNS = 'http://www.w3.org/2000/svg';
    const w = 16 + unidades * 15;
    const h = 15;
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.classList.add('tachon-svg');

    const trazos = [
      `M2,${(h*0.55).toFixed(1)} C ${(w*0.18).toFixed(1)},${(h*0.12).toFixed(1)} ${(w*0.32).toFixed(1)},${(h*0.9).toFixed(1)} ${(w*0.5).toFixed(1)},${(h*0.42).toFixed(1)} C ${(w*0.68).toFixed(1)},${(h*0.02).toFixed(1)} ${(w*0.82).toFixed(1)},${(h*0.92).toFixed(1)} ${(w-2).toFixed(1)},${(h*0.5).toFixed(1)}`,
      `M3,${(h*0.78).toFixed(1)} C ${(w*0.22).toFixed(1)},${(h*0.98).toFixed(1)} ${(w*0.4).toFixed(1)},${(h*0.22).toFixed(1)} ${(w*0.6).toFixed(1)},${(h*0.72).toFixed(1)} C ${(w*0.75).toFixed(1)},${(h*0.98).toFixed(1)} ${(w*0.88).toFixed(1)},${(h*0.3).toFixed(1)} ${(w-3).toFixed(1)},${(h*0.62).toFixed(1)}`
    ];
    trazos.forEach((d, i) => {
      const path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', d);
      path.classList.add('tachon-trazo');
      if(i === 1) path.style.opacity = '0.55';
      svg.appendChild(path);
    });

    const span = document.createElement('span');
    span.className = 'tachon';
    span.setAttribute('aria-label', 'texto ilegible');
    span.appendChild(svg);
    return span;
  }

  function construirParrafo(texto){
    const frag = document.createDocumentFragment();
    const regex = /§§(\d+)§§/g;
    let lastIndex = 0;
    let match;
    while((match = regex.exec(texto)) !== null){
      if(match.index > lastIndex){
        frag.appendChild(document.createTextNode(texto.slice(lastIndex, match.index)));
      }
      frag.appendChild(crearTachon(parseInt(match[1], 10)));
      lastIndex = regex.lastIndex;
    }
    if(lastIndex < texto.length){
      frag.appendChild(document.createTextNode(texto.slice(lastIndex)));
    }
    return frag;
  }

  /* ---- bruma plateada + humo negro central: pagina final ---- */
  let brumaCanvas = null;
  let brumaCtx = null;
  let brumaParticulas = [];
  let brumaAnimId = null;
  let pulsoValor = 0;      // 0 = calma, sube en cada pulso y decae solo
  let pulsoProximo = 0;    // cuadros restantes hasta el siguiente pulso

  let brumaBlackSVG = null;
  let journalBlackGroupEl = null;

  let mezclaRojo = 0;             // 0 = niebla plateada, 1 = niebla completamente rojiza
  let intensidadLatido = 1;       // multiplicador del pulso de la masa negra
  let intensidadLatidoObjetivo = 1;

  /* ---- efecto agua: gotas + petalos de jazmin, con reacciones al scroll ---- */
  let waterDropsEl = null;
  let jazminEl = null;
  let efectoAguaActivo = false;
  let markerGregorovitch = null;
  let markerEspejos = null;
  let markerNucleos = null;
  let petalosOcultos = false;
  let vibracionActiva = false;
  let scrollEfectoRaf = null;

  function generarGotas(){
    if(!waterDropsEl) return;
    waterDropsEl.innerHTML = '';
    const cantidad = 22;
    for(let n=0; n<cantidad; n++){
      const gota = document.createElement('div');
      const esCorredera = n % 3 !== 0;
      gota.className = esCorredera ? 'gota-corredera' : 'gota-fija';
      const left = Math.random()*100;
      gota.style.left = left.toFixed(2) + 'vw';
      if(esCorredera){
        const alto = 40 + Math.random()*90;
        gota.style.height = alto.toFixed(0) + 'px';
        gota.style.setProperty('--gota-op', (0.3 + Math.random()*0.4).toFixed(2));
        gota.style.setProperty('--gota-dur-base', (2.6 + Math.random()*3.4).toFixed(2) + 's');
        gota.style.animationDelay = (-Math.random()*6).toFixed(2) + 's';
      } else {
        const tam = 4 + Math.random()*9;
        gota.style.width = tam.toFixed(0) + 'px';
        gota.style.height = tam.toFixed(0) + 'px';
        gota.style.top = (Math.random()*100).toFixed(2) + 'vh';
        gota.style.animationDelay = (-Math.random()*3.8).toFixed(2) + 's';
      }
      waterDropsEl.appendChild(gota);
    }
  }

  function generarPetalos(){
    if(!jazminEl) return;
    jazminEl.innerHTML = '';
    const cantidad = 7;
    for(let n=0; n<cantidad; n++){
      const petalo = document.createElement('div');
      petalo.className = 'petalo';
      petalo.style.left = (Math.random()*100).toFixed(2) + 'vw';
      petalo.style.setProperty('--deriva', (18 + Math.random()*46).toFixed(0) + 'px');
      petalo.style.animationDuration = (9 + Math.random()*7).toFixed(2) + 's';
      petalo.style.animationDelay = (-Math.random()*12).toFixed(2) + 's';
      petalo.style.transform = `rotate(${Math.floor(Math.random()*360)}deg)`;
      jazminEl.appendChild(petalo);
    }
  }

  function buscarMarcadoresTexto(){
    markerGregorovitch = null;
    markerEspejos = null;
    markerNucleos = null;
    entryBodyEl.querySelectorAll('p').forEach(p => {
      const t = p.textContent.trim();
      if(!markerGregorovitch && t === 'Gregorovitch.') markerGregorovitch = p;
      if(!markerEspejos && t === 'Los espejos se agitaron.') markerEspejos = p;
      if(!markerNucleos && t === 'Núcleos de Sangre.') markerNucleos = p;
    });
  }

  function posicionEnPagina(el){
    if(!el) return 0;
    const pageRect = journalPage.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    return elRect.top - pageRect.top + journalPage.scrollTop;
  }

  function evaluarEfectosScroll(){
    if(!efectoAguaActivo) return;
    const lineaLectura = journalPage.scrollTop + journalPage.clientHeight * 0.55;

    const pasoGregorovitch = markerGregorovitch ? lineaLectura >= posicionEnPagina(markerGregorovitch) : false;
    const pasoEspejos = markerEspejos ? lineaLectura >= posicionEnPagina(markerEspejos) : false;

    intensidadLatidoObjetivo = pasoGregorovitch ? 1.9 : 1;

    if(pasoGregorovitch && !petalosOcultos){
      petalosOcultos = true;
      if(jazminEl) jazminEl.classList.add('petalos-ocultos');
    } else if(!pasoGregorovitch && petalosOcultos){
      petalosOcultos = false;
      if(jazminEl) jazminEl.classList.remove('petalos-ocultos');
    }

    if(pasoEspejos && !vibracionActiva){
      vibracionActiva = true;
      screenReader.classList.add('vibracion-activa');
    } else if(!pasoEspejos && vibracionActiva){
      vibracionActiva = false;
      screenReader.classList.remove('vibracion-activa');
    }

    if(pasoEspejos && markerEspejos){
      const topEspejos = posicionEnPagina(markerEspejos);
      const topNucleos = markerNucleos ? posicionEnPagina(markerNucleos) : topEspejos + 1;
      const rango = Math.max(1, topNucleos - topEspejos);
      const progreso = (lineaLectura - topEspejos) / rango;
      mezclaRojo = Math.max(0, Math.min(1, progreso));
    } else {
      mezclaRojo = 0;
    }

    if(waterDropsEl){
      const gr = Math.round(214 + (132 - 214) * mezclaRojo);
      const gg = Math.round(224 + (16 - 224) * mezclaRojo);
      const gb = Math.round(236 + (20 - 236) * mezclaRojo);
      waterDropsEl.style.setProperty('--gota-color', `${gr},${gg},${gb}`);
      waterDropsEl.style.setProperty('--gota-lentitud', (1 + mezclaRojo * 1.7).toFixed(2));
      waterDropsEl.style.setProperty('--gota-espesor', (1 + mezclaRojo * 1.6).toFixed(2));
    }
  }

  function onScrollEfectoAgua(){
    if(scrollEfectoRaf) return;
    scrollEfectoRaf = requestAnimationFrame(() => {
      scrollEfectoRaf = null;
      evaluarEfectosScroll();
    });
  }

  function activarEfectoAgua(){
    if(!waterDropsEl) waterDropsEl = document.getElementById('waterDrops');
    if(!jazminEl) jazminEl = document.getElementById('jazminPetalos');

    efectoAguaActivo = true;
    petalosOcultos = false;
    vibracionActiva = false;
    mezclaRojo = 0;
    intensidadLatido = 1;
    intensidadLatidoObjetivo = 1;

    generarGotas();
    generarPetalos();
    waterDropsEl.classList.add('activo');
    jazminEl.classList.remove('petalos-ocultos');
    jazminEl.classList.add('activo');
    journalPage.classList.add('pagina-mojada');
    screenReader.classList.remove('vibracion-activa');

    buscarMarcadoresTexto();
    journalPage.removeEventListener('scroll', onScrollEfectoAgua);
    journalPage.addEventListener('scroll', onScrollEfectoAgua);
    evaluarEfectosScroll();
  }

  function desactivarEfectoAgua(){
    efectoAguaActivo = false;
    if(waterDropsEl) waterDropsEl.classList.remove('activo');
    if(jazminEl){ jazminEl.classList.remove('activo'); jazminEl.classList.remove('petalos-ocultos'); }
    journalPage.classList.remove('pagina-mojada');
    screenReader.classList.remove('vibracion-activa');
    journalPage.removeEventListener('scroll', onScrollEfectoAgua);
    mezclaRojo = 0;
    intensidadLatido = 1;
    intensidadLatidoObjetivo = 1;
    markerGregorovitch = null;
    markerEspejos = null;
    markerNucleos = null;
  }

  function redimensionarBruma(){
    if(!brumaCanvas) return;
    brumaCanvas.width = window.innerWidth;
    brumaCanvas.height = window.innerHeight;
  }

  function iniciarBruma(){
    if(!brumaCanvas){
      brumaCanvas = document.getElementById('brumaCanvas');
      brumaCtx = brumaCanvas.getContext('2d');
    }
    if(!brumaBlackSVG){
      brumaBlackSVG = document.getElementById('brumaBlackSVG');
      journalBlackGroupEl = document.getElementById('journalBlackGroup');
    }
    redimensionarBruma();

    // bruma plateada: capas grandes y superpuestas que se funden entre si,
    // cada una con lobulos internos para que la forma cambie sola
    brumaParticulas = [];
    const cantidad = 34;
    for(let n=0; n<cantidad; n++){
      const lobulos = [];
      const nLob = 3;
      for(let l=0; l<nLob; l++){
        lobulos.push({
          angulo: (Math.PI*2/nLob)*l + Math.random()*0.6,
          velAngulo: (Math.random()-0.5) * 0.01,
          dist: 10 + Math.random()*16,
          fase: Math.random()*Math.PI*2,
          velFase: 0.006 + Math.random()*0.01
        });
      }
      brumaParticulas.push({
        x: Math.random() * brumaCanvas.width,
        y: Math.random() * brumaCanvas.height,
        r: 130 + Math.random() * 220,
        vx: (Math.random() - 0.5) * 0.1,
        vy: (Math.random() - 0.5) * 0.05 - 0.018,
        op: 0.06 + Math.random() * 0.1,
        fase: Math.random() * Math.PI * 2,
        velFase: 0.0003 + Math.random() * 0.0005,
        lobulos
      });
    }

    pulsoValor = 0;
    pulsoProximo = 70 + Math.random()*110;

    brumaCanvas.classList.add('activo');
    if(brumaBlackSVG) brumaBlackSVG.classList.add('activo');
    if(brumaAnimId) cancelAnimationFrame(brumaAnimId);
    animarBruma();
  }

  function animarBruma(){
    if(!brumaCanvas || !brumaCtx) return;
    const W = brumaCanvas.width, H = brumaCanvas.height;
    brumaCtx.clearRect(0, 0, W, H);

    /* --- particulas plateadas (o rojizas, segun mezclaRojo), cambiando de forma --- */
    const cr = Math.round(228 + (150 - 228) * mezclaRojo);
    const cg = Math.round(231 + (22 - 231) * mezclaRojo);
    const cb = Math.round(240 + (26 - 240) * mezclaRojo);
    const colorMist = `${cr},${cg},${cb}`;

    brumaCtx.globalCompositeOperation = 'lighter';
    brumaParticulas.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.fase += p.velFase;
      if(p.x < -p.r) p.x = W + p.r;
      if(p.x > W + p.r) p.x = -p.r;
      if(p.y < -p.r) p.y = H + p.r;
      if(p.y > H + p.r) p.y = -p.r;

      const opBase = p.op * (0.6 + 0.4 * Math.sin(p.fase));

      p.lobulos.forEach(lob => {
        lob.angulo += lob.velAngulo;
        lob.fase += lob.velFase;
        const desplazamiento = lob.dist * (0.7 + 0.3 * Math.sin(lob.fase));
        const cx = p.x + Math.cos(lob.angulo) * desplazamiento;
        const cy = p.y + Math.sin(lob.angulo) * desplazamiento;
        const radioLob = p.r * (0.55 + 0.25 * Math.sin(lob.fase * 1.3));
        const grad = brumaCtx.createRadialGradient(cx, cy, 0, cx, cy, radioLob);
        grad.addColorStop(0, `rgba(${colorMist},${(opBase*0.8).toFixed(3)})`);
        grad.addColorStop(0.6, `rgba(${colorMist},${(opBase*0.35).toFixed(3)})`);
        grad.addColorStop(1, `rgba(${colorMist},0)`);
        brumaCtx.fillStyle = grad;
        brumaCtx.beginPath();
        brumaCtx.arc(cx, cy, radioLob, 0, Math.PI * 2);
        brumaCtx.fill();
      });
    });

    /* --- pulso: alterna calma y arranques violentos, como un latido ---
       intensidadLatido sube (mas fuerte y mas seguido) cuando el scroll
       de la entrada con efecto agua pasa por "Gregorovitch." --- */
    intensidadLatido += (intensidadLatidoObjetivo - intensidadLatido) * 0.02;

    pulsoProximo--;
    if(pulsoProximo <= 0){
      pulsoValor = (0.7 + Math.random() * 0.9) * intensidadLatido;
      pulsoProximo = (50 + Math.random() * 140) / intensidadLatido;
    }
    pulsoValor *= 0.965;
    const intensidad = pulsoValor;

    /* --- masa negra central: ahora es la turbulencia SVG (feTurbulence +
       feDisplacementMap), el mismo pulso de calma/arranque solo controla
       su tamaño con un escalado, la textura ya se retuerce sola --- */
    if(journalBlackGroupEl){
      const escala = Math.min(1.85, 1 + intensidad * 0.4);
      journalBlackGroupEl.style.transform = `scale(${escala.toFixed(3)})`;
    }

    brumaAnimId = requestAnimationFrame(animarBruma);
  }

  function detenerBruma(){
    if(brumaAnimId){
      cancelAnimationFrame(brumaAnimId);
      brumaAnimId = null;
    }
    if(brumaCanvas){
      brumaCanvas.classList.remove('activo');
      if(brumaCtx) brumaCtx.clearRect(0, 0, brumaCanvas.width, brumaCanvas.height);
    }
    if(brumaBlackSVG){
      brumaBlackSVG.classList.remove('activo');
    }
  }

  window.addEventListener('resize', () => {
    if(brumaCanvas && brumaCanvas.classList.contains('activo')) redimensionarBruma();
  });

  function pintarEntrada(i){
    const entrada = entradas[i];
    journalPage.classList.toggle('hoja-arrancada', !!entrada.arrancada);
    entryDateEl.textContent = entrada.fecha;
    entryBodyEl.innerHTML = '';
    entrada.parrafos.forEach(texto => {
      const p = document.createElement('p');
      p.appendChild(construirParrafo(texto));
      entryBodyEl.appendChild(p);
    });
    pageCounter.textContent = `Página ${i+1} de ${entradas.length}`;

    if(entrada.especial === 'bruma'){
      aplicarNivel(0);
      document.querySelectorAll('.crack-seg, .crack-shard').forEach(el => { el.style.opacity = 0; });
      darkOverlay.style.opacity = 0;
      document.body.classList.add('bruma-modo');
      screenReader.classList.add('bruma-activa');
      journalPage.classList.add('bruma-articulo');
      iniciarBruma();
    } else {
      document.body.classList.remove('bruma-modo');
      screenReader.classList.remove('bruma-activa');
      journalPage.classList.remove('bruma-articulo');
      detenerBruma();
      aplicarNivel(entrada.nivel);
    }

    if(entrada.efectoAgua){
      activarEfectoAgua();
    } else {
      desactivarEfectoAgua();
    }

    const textoSpan = navBtn.querySelector('span');
    if(i < entradas.length - 1){
      textoSpan.textContent = 'Ver página siguiente';
      navBtn.onclick = () => irAPagina(i+1);
    } else {
      textoSpan.textContent = 'Cerrar la bitácora';
      navBtn.onclick = () => cerrarLector();
    }
  }

  function irAPagina(i){
    journalPage.classList.add('transicion');
    setTimeout(() => {
      indiceActual = i;
      pintarEntrada(i);
      journalPage.scrollTop = 0;
      requestAnimationFrame(() => journalPage.classList.remove('transicion'));
    }, 380);
  }

  function abrirLector(indiceInicial){
    const inicio = (typeof indiceInicial === 'number') ? indiceInicial : 0;
    construirGrietas();
    screenIntro.classList.add('fundido');
    screenReader.classList.add('abierto');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => screenReader.classList.add('visible'));
    });
    indiceActual = inicio;
    pintarEntrada(inicio);
  }

  function cerrarLector(){
    screenReader.classList.remove('visible');
    screenIntro.classList.remove('fundido');
    detenerBruma();
    desactivarEfectoAgua();
    document.body.classList.remove('bruma-modo');
    screenReader.classList.remove('bruma-activa');
    journalPage.classList.remove('bruma-articulo');
    setTimeout(() => {
      screenReader.classList.remove('abierto');
      indiceActual = 0;
      journalPage.scrollTop = 0;
    }, 600);
  }
</script>

</body>
</html>
